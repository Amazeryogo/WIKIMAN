[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiman"
version = "0.1.0"
description = "Wiki software that is actually usable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["Flask>=3.0", "Markdown>=3.5", "nh3>=0.2.14", "waitress>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wikiman = "wikiman.__main__:main"

[tool.setuptools.packages.find]
include = ["wikiman*"]

[tool.setuptools.package-data]
wikiman = ["templates/**/*", "static/*"]
