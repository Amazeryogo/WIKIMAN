{% extends "base.html" %}
{% block title %}{{ error.code }}{% endblock %}
{% block content %}
<article class="page empty-state">
  <h1 class="page-title">{{ error.code }} · {{ error.name }}</h1>
  <p>{{ error.description }}</p>
  <a class="btn" href="{{ url_for('wiki.index') }}">Go to the main page</a>
</article>
{% endblock %}
